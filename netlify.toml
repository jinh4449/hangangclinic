# 이 저장소에는 이미 만들어진 HTML 이 들어 있다.
# Netlify 는 빌드할 것이 없고 파일을 그대로 올리기만 하면 된다.

[build]
  command = ""
  publish = "."

# 파일 이름에 해시가 붙어 있어 내용이 바뀌면 이름도 바뀐다. 오래 캐시해도 안전하다
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML 은 매번 확인하게 둔다. 내용을 고쳤는데 옛 화면이 남으면 안 된다
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
